<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StarTrack</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>StarTrack</h1>
        <p>Star Wars 콘텐츠 정보·최신 소식 큐레이션 서비스</p>
        <nav>
            <a href="/">최신 소식</a>
            <a href="/works">작품 정보</a>
        </nav>
    </header>

    <main>
        <h2>최신 소식</h2>

        <form class="search-box" method="get" action="/">
            <input 
                type="text" 
                name="keyword" 
                placeholder="검색어를 입력하세요"
                value="{{ keyword }}"
            >

            <select name="category">
                <option value="">전체 카테고리</option>
                {% for category in categories %}
                    <option value="{{ category[0] }}"
                        {% if selected_category == category[0] %}selected{% endif %}
                    >
                        {{ category[0] }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">검색</button>
        </form>

        <div class="card-container">
            {% for article in articles %}
            <div class="card">
                <span class="badge">{{ article[5] }}</span>
                <h3>{{ article[1] }}</h3>
                <p class="meta">{{ article[2] }} · {{ article[3] }}</p>
                <p>{{ article[4] }}</p>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
